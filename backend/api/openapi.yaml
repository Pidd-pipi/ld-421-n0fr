openapi: 3.0.3
info:
  title: 实验室设备管理系统 API
  version: 1.0.0
  description: 设备资产登记、借用归还、维护保养、使用预约与状态看板接口。
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Equipment
  - name: Borrow
  - name: Maintenance
  - name: Reservation
  - name: Disposal
  - name: Category
  - name: Dashboard
  - name: Audit
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 登录并获取 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200': { description: 登录成功 }
  /auth/me:
    get:
      tags: [Auth]
      summary: 当前登录用户信息
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /users:
    get:
      tags: [Auth]
      summary: 分页查询用户
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses:
        '200': { description: 成功 }
  /equipment:
    get:
      tags: [Equipment]
      summary: 分页查询设备
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
    post:
      tags: [Equipment]
      summary: 登记设备
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /equipment/{id}:
    get:
      tags: [Equipment]
      summary: 设备详情
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
    put:
      tags: [Equipment]
      summary: 更新设备
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /equipment/{id}/disposal:
    get:
      tags: [Disposal]
      summary: 查询设备的处置（报废）审批进度，无记录时 data 为 null
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
    post:
      tags: [Disposal]
      summary: 提交设备报废处置申请（管理员/实验室管理员），提交后暂停新的借用和预约
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 512 }
      responses:
        '200': { description: 申请已提交，等待审批 }
        '409': { description: '重复提交或设备状态不允许报废' }
  /equipment/{id}/owner:
    patch:
      tags: [Equipment]
      summary: 转移责任人
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /disposals:
    get:
      tags: [Disposal]
      summary: 分页查询处置审批单
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [Pending, Approved, Returned] } }
        - { name: equipment_id, in: query, schema: { type: integer } }
      responses:
        '200': { description: 成功 }
  /disposals/{id}:
    get:
      tags: [Disposal]
      summary: 处置审批单详情
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /disposals/{id}/review:
    post:
      tags: [Disposal]
      summary: >-
        处置审批（管理员/实验室管理员）：无未归还借用/未结束预约时通过并将设备置为 Retired；
        存在阻塞项时审批单退回（Returned）并在 blockers 中列出阻塞项，原借用/预约记录保留；
        重复审批返回 409。
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 审批完成（approved=true 为通过，false 为退回并携带 blockers） }
        '409': { description: 审批单已被处理 }
  /borrows:
    get:
      tags: [Borrow]
      summary: 分页查询借用记录
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
    post:
      tags: [Borrow]
      summary: 提交借用申请
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /borrows/{id}/approve:
    post:
      tags: [Borrow]
      summary: 审批通过
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /borrows/{id}/reject:
    post:
      tags: [Borrow]
      summary: 驳回申请
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /borrows/{id}/return:
    post:
      tags: [Borrow]
      summary: 确认归还
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /maintenance:
    get:
      tags: [Maintenance]
      summary: 分页查询维护记录
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
    post:
      tags: [Maintenance]
      summary: 创建维护记录
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /maintenance/stats:
    get:
      tags: [Maintenance]
      summary: 维护统计
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /reservations:
    get:
      tags: [Reservation]
      summary: 分页查询预约
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
    post:
      tags: [Reservation]
      summary: 创建预约
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /reservations/{id}/approve:
    post:
      tags: [Reservation]
      summary: 审批通过预约
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /reservations/{id}/reject:
    post:
      tags: [Reservation]
      summary: 驳回预约
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /reservations/{id}/cancel:
    post:
      tags: [Reservation]
      summary: 取消预约
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /categories:
    get:
      tags: [Category]
      summary: 查询分类树
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
    post:
      tags: [Category]
      summary: 新增分类
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: 仪表盘统计
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /audit-logs:
    get:
      tags: [Audit]
      summary: 分页查询审计日志
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
